name: $(build.version.major).$(build.version.minor).$(build.version.revision)

trigger:
  branches:
    include:
    - master
    - main

resources:
  repositories:
  - repository: release_tools
    type: git
    name: release-tools/release-tools
    ref: master

variables:
  - name: buildConfiguration
    value: 'Release'
  - name: build.version.major
    value: 1
  - name: build.version.minor
    value: 0
  - name: build.version.revision
    value: $[counter(format('{0}.{1}', variables['build.version.major'], variables['build.version.minor']), 0)]
  - name: build.version
    value: $(build.version.major).$(build.version.minor).$(build.version.revision)
  - name: projectPath
    value: 'resourcemanagement-mcp/src/Lithnet.ResourceManagement.McpServer/Lithnet.ResourceManagement.McpServer.csproj'
  - name: testProjectPath
    value: 'resourcemanagement-mcp/src/Lithnet.ResourceManagement.McpServer.Tests/Lithnet.ResourceManagement.McpServer.Tests.csproj'
  # The server assembly is signed where the build leaves it, because that is the
  # output that pack consumes. Redirecting the build elsewhere would sign a copy
  # that never reaches the package.
  - name: serverAssemblyGlob
    value: '$(Build.SourcesDirectory)/resourcemanagement-mcp/src/Lithnet.ResourceManagement.McpServer/**/Lithnet.ResourceManagement.McpServer.dll'
  - name: packDir
    value: '$(Build.ArtifactStagingDirectory)/nuget'
  - name: nugetServiceConnection
    value: 'MimManagementAgentsNuget'

stages:
- stage: build
  displayName: Build, Test and Pack
  jobs:
  - job: build
    displayName: Build
    pool:
      vmImage: 'windows-latest'
    steps:
    - checkout: self
      path: s/resourcemanagement-mcp

    - checkout: release_tools
      path: release-tools

    - task: UseDotNet@2
      displayName: Install .NET 10 SDK
      inputs:
        packageType: 'sdk'
        version: '10.x'

    # Lithnet.ResourceManagement.Client is restored from the internal Azure Artifacts
    # feed declared in nuget.config, so the feed must be authenticated before restore.
    - task: NuGetAuthenticate@1
      displayName: Authenticate with NuGet

    # feedsToUse/nugetConfigPath are required here: left unset, the restore task
    # synthesizes its own temporary NuGet config containing only nuget.org, which
    # silently overrides the repository's nuget.config and puts the internal feed
    # out of reach.
    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: 'restore'
        projects: '**/*.csproj'
        feedsToUse: 'config'
        nugetConfigPath: 'resourcemanagement-mcp/src/nuget.config'

    # Build the test project as well, so the tests can run without rebuilding. A
    # test run that rebuilds would recompile the server through its project
    # reference, replacing the signed, version-stamped assembly with an unsigned
    # one that pack would then ship.
    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: 'build'
        projects: |
          $(projectPath)
          $(testProjectPath)
        arguments: '-c $(buildConfiguration) -p:Version=$(build.version) -p:GeneratePackageOnBuild=false --no-restore'

    - task: DotNetCoreCLI@2
      displayName: Test
      inputs:
        command: 'test'
        projects: '$(testProjectPath)'
        arguments: '-c $(buildConfiguration) --no-build --no-restore'

    # Sign before packing, so the package carries the signed assembly.
    - template: templates/codesign.yaml@release_tools
      parameters:
        path:
        - $(serverAssemblyGlob)
        environment: 'prod'
        azureSubscription: 'ProductionServices'
        description: 'Lithnet MIM MCP Server'

    - task: DotNetCoreCLI@2
      displayName: Pack
      inputs:
        command: 'pack'
        packagesToPack: '$(projectPath)'
        packDirectory: '$(packDir)'
        nobuild: true
        includesymbols: true
        versioningScheme: 'byEnvVar'
        versionEnvVar: 'build.version'

    - template: templates/codesign.yaml@release_tools
      parameters:
        path:
        - $(packDir)/*.nupkg
        - $(packDir)/*.snupkg
        environment: 'prod'
        azureSubscription: 'ProductionServices'
        description: 'Lithnet MIM MCP Server'

    - publish: $(packDir)
      displayName: Publish NuGet artifact
      artifact: nuget

- stage: publish_internal
  displayName: Publish to internal feed
  dependsOn: build
  jobs:
  - job: publish
    displayName: Publish
    pool:
      vmImage: 'windows-latest'
    steps:
    - checkout: release_tools
      path: release-tools

    - download: current
      artifact: nuget

    - template: templates/publish-nuget.yaml@release_tools
      parameters:
        nugetPackagePath: '$(Pipeline.Workspace)/nuget/*.nupkg'
        symbolPackagePath: '$(Pipeline.Workspace)/nuget/*.snupkg'
        publishInternal: true
        publishExternal: false

- stage: publish_external
  displayName: Publish to nuget.org
  dependsOn: publish_internal
  jobs:
  - deployment: publish
    displayName: Publish
    pool:
      vmImage: 'windows-latest'
    environment: 'Public nuget feed'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: release_tools
            path: release-tools

          - download: current
            artifact: nuget

          - template: templates/publish-nuget.yaml@release_tools
            parameters:
              nugetPackagePath: '$(Pipeline.Workspace)/nuget/*.nupkg'
              symbolPackagePath: '$(Pipeline.Workspace)/nuget/*.snupkg'
              publishInternal: false
              publishExternal: true
              externalFeedCredentials: '$(nugetServiceConnection)'
